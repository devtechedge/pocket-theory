name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pocket_theory
          POSTGRES_PASSWORD: pocket_theory_ci_pw
          POSTGRES_DB: pocket_theory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocket_theory -d pocket_theory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pocket_theory:pocket_theory_ci_pw@localhost:5432/pocket_theory_test
      DATABASE_URL_UNPOOLED: postgresql://pocket_theory:pocket_theory_ci_pw@localhost:5432/pocket_theory_test
      DATABASE_URL_TEST: postgresql://pocket_theory:pocket_theory_ci_pw@localhost:5432/pocket_theory_test
      DATABASE_URL_E2E: postgresql://pocket_theory:pocket_theory_ci_pw@localhost:5432/pocket_theory_test
      SESSION_PEPPER: ci-ephemeral-session-pepper-not-a-production-secret-2026
      NEXT_PUBLIC_SITE_URL: http://localhost:3140
      DEMO_MODE: "1"
      ALLOW_PROD_SEED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply PostgreSQL schema & seed 40 SKUs
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Re-seed clean 40-SKU fixture before E2E
        run: npm run db:seed
      - name: Production build
        run: npm run build
      - name: Playwright E2E + Axe WCAG AA
        run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
